<header class="header">
  <div class="header__inner container">
    <a
      routerLink="/"
      fragment="hero"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      aria-label="Home"
    >
      <app-logo></app-logo>
    </a>

    <div class="right-group">
      <!-- Desktop-Navigation -->
      <nav class="nav">
        <a
          routerLink="/"
          fragment="about"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="scrollToSection($event, 'about')"
        >
          {{ "ABOUT_ME" | translate }}
        </a>

        <a
          routerLink="/"
          fragment="skills"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="scrollToSection($event, 'skills')"
        >
          {{ "SKILLS" | translate }}
        </a>

        <a
          routerLink="/"
          fragment="projects"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="scrollToSection($event, 'projects')"
        >
          {{ "PROJECTS" | translate }}
        </a>
      </nav>

      <!-- Lang -->
      <div class="lang-switch">
        <button
          class="lang-btn"
          [class.active]="currentLang === 'de'"
          (click)="switchLang('de')"
        >
          DE
        </button>
        <button
          class="lang-btn"
          [class.active]="currentLang === 'en'"
          (click)="switchLang('en')"
        >
          EN
        </button>
      </div>

      <!-- Burger -->
      <button
        class="burger"
        (click)="toggleMenu()"
        [class.open]="isMenuOpen"
        aria-label="Open menu"
        [attr.aria-expanded]="isMenuOpen"
      >
        <span></span><span></span><span></span>
      </button>
    </div>

    <!-- Mobile Overlay -->
    <div class="nav-overlay" [class.open]="isMenuOpen" (click)="closeMenu()">
      <div class="menu" (click)="$event.stopPropagation()">
        <a routerLink="/" fragment="about" (click)="scrollToSection($event, 'about')">{{
          "ABOUT_ME" | translate
        }}</a>
        <a routerLink="/" fragment="skills" (click)="scrollToSection($event, 'skills')">{{
          "SKILLS" | translate
        }}</a>
        <a routerLink="/" fragment="projects" (click)="scrollToSection($event, 'projects')">{{
          "PROJECTS" | translate
        }}</a>
        <a routerLink="/" fragment="contact" (click)="scrollToSection($event, 'contact')">{{
          "CONTACT" | translate
        }}</a>

        <div class="langs">
          <button
            class="lang-btn"
            [class.active]="currentLang === 'en'"
            (click)="switchLang('en')"
          >
            EN
          </button>
          <button
            class="lang-btn"
            [class.active]="currentLang === 'de'"
            (click)="switchLang('de')"
          >
            DE
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
