<footer class="footer" id="footer">
  <!-- top green rule is drawn via ::before in CSS -->
  <div class="footer__inner">
    <!-- Left: brand + legal links -->
    <div class="footer__brand">
      <!-- If you have a logo, replace the span with an <img> -->
      <a routerLink="/" class="brand">
        <span class="brand__text">
          Uğur<span class="brand__accent">say</span>
        </span>
      </a>

      <nav class="footer__links">
        <a routerLink="/impressum">{{ 'IMPRESSUM' | translate }}</a>
        <a routerLink="/datenschutz">{{ 'DATENSCHUTZ' | translate }}</a>
      </nav>
    </div>

    <!-- Middle: copyright -->
    <div class="footer__copy">
      © {{ currentYear }} Uğursay Pürçek
    </div>

    <!-- Right: socials -->
    <nav class="footer__socials" aria-label="social links">
      <a
        href="https://github.com/UG1287"
        target="_blank" rel="noopener"
        aria-label="GitHub"
        class="social"
      >
        <img src="assets/icons/8. Github button.png" alt="" />
      </a>

      <a
        href="https://linkedin.com/in/ugursay-pürcek-566674192"
        target="_blank" rel="noopener"
        aria-label="LinkedIn"
        class="social"
      >
        <img src="assets/icons/10. Linkedin button.png" alt="" />
      </a>
    </nav>
  </div>
</footer>
