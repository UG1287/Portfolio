<section class="about" id="about">
  <div class="container">
  <div class="about__grid">
    <!-- Text -->
    <div class="about__copy" data-aos="fade-right">
      <h2 class="about__title">{{ 'ABOUT_ME' | translate }}</h2>

      <p class="about__lead">{{ 'ABOUT_TEXT_1' | translate }}</p>
      <p>{{ 'ABOUT_TEXT_2' | translate }}</p>

      <a
        href="#skills"
        class="about__cta"
        (click)="scrollTo('skills', $event)"
      >
        {{ 'SEE_MY_SKILLS' | translate }}
      </a>
    </div>

    <!-- Bild -->
    <div class="about__visual" data-aos="fade-left">
      <!-- optional: lila Glow aus dem Figma-Export -->
      <img src="assets/shadows/Purpleshadow2.svg" alt="" class="about__glow" aria-hidden="true" />

      <div class="about__portraitWrap">
        <img
          src="assets/img/UgursayohneHintergrund.png"
          alt="Uğursay Pürçek"
          class="about__portrait"
          width="370" height="370"
          loading="lazy" decoding="async"
        />
        <span class="about__ring" aria-hidden="true"></span>
      </div>

      <span class="about__line" aria-hidden="true"></span>
    </div>
  </div>
  </div>
</section>
