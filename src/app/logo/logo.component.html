<div class="logo" aria-label="Ugursay Logo">
  <svg
    width="170"
    height="42"
    viewBox="0 0 170 42"
    xmlns="http://www.w3.org/2000/svg"
  >
    <style>
      .logo-text {
        font-family: "Poppins", sans-serif;
        font-size: 28px;
        font-weight: 700;
      }

      .default {
        fill: var(--text);
      }

      .accent {
        fill: var(--accent);
      }

      .underline {
        stroke: var(--primary);
        stroke-width: 3;
      }
    </style>

    <text x="0" y="30" class="logo-text">
      <tspan class="default">U</tspan>
      <tspan class="accent">ğ</tspan>
      <tspan class="default">ursay</tspan>
    </text>

    <line x1="0" y1="38" x2="155" y2="38" class="underline" />
  </svg>
</div>
