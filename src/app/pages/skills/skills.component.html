<section class="skills" id="skills">
  <div class="skills__inner">
    <!-- ICON-GRID links -->
    <div class="skills__grid" data-aos="fade-right">
      <div class="skill" *ngFor="let s of skills" [class.is-learning]="s.key === 'learning'">
        <div class="skill__tile" tabindex="0">
          <img
            class="skill__icon"
            [src]="s.icon"
            [alt]="s.name"
            width="64"
            height="64"
            loading="lazy"
            decoding="async"
          />
        </div>

        <span class="skill__name">{{ s.name }}</span>

        <!-- Tooltip nur beim Learning-Item -->
        <div class="skill__tooltip" *ngIf="s.tooltip">
          <div class="st__title">{{ s.tooltip.title }}</div>
          <div class="st__badges">
            <div class="st__badge" *ngFor="let it of s.tooltip.items">
              <img [src]="it.icon" [alt]="it.name" width="28" height="28" />
              <span>{{ it.name }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- COPY / CTA rechts -->
    <div class="skills__copy" data-aos="fade-left">
      <h2 class="skills__title">{{ 'SKILLS' | translate }}</h2>

      <p class="skills__lead">{{ 'SKILLS_LEAD' | translate }}</p>

      <p class="skills__ask">
        {{ 'LOOKING_FOR' | translate }}
        <span class="accent">{{ 'ANOTHER_SKILL' | translate }}</span>?
      </p>

      <p class="skills__note">{{ 'SKILLS_NOTE' | translate }}</p>

      <button class="btn" (click)="scrollTo('contact', $event)">
        {{ 'CONTACT' | translate }}
      </button>
    </div>
  </div>
</section>
